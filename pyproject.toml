[project]
name = "mailvault"
version = "0.10.0"
description = "Back up and archive email from IMAP and Microsoft 365 (Graph) mailboxes"
authors = [{ name = "Stefan Schönberger", email = "stefan@sniner.dev" }]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
keywords = ["imap", "email", "backup", "archive", "microsoft365", "msgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: System :: Archiving :: Backup",
]
requires-python = ">=3.11"
dependencies = [
    "imapclient",
    # Python 3.14 ships zstd in the stdlib (PEP 784); the package is only needed
    # before that. mailvault.store.zstd picks whichever is available.
    "zstandard; python_version < '3.14'",
    "msal",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/sniner/mailvault"
Repository = "https://github.com/sniner/mailvault"
Issues = "https://github.com/sniner/mailvault/issues"
Changelog = "https://github.com/sniner/mailvault/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint",
    "pytest",
    "ruff",
    "basedpyright>=1.38.1",
]

[tool.uv]
package = true

[tool.pyright]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
per-file-ignores = { "__init__.py" = ["F401"] }

[project.scripts]
mailvault = "mailvault.cli:main"

#[[tool.uv.index]]
#name = "pypi"
#url = "https://pypi.org/simple"

#[tool.uv.sources]
#mailvault = { path = ".", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
