[project]
name = "mailvault"
version = "0.5.0"
description = "Back up and archive email from IMAP and Microsoft 365 (Graph) mailboxes"
authors = [{ name = "Stefan Schönberger", email = "stefan@sniner.dev" }]
requires-python = ">=3.11"
dependencies = [
    "imapclient",
    "pyyaml",
    "zstandard",
    "msal",
    "httpx",
]

[dependency-groups]
dev = [
    "pylint",
    "pytest",
    "ruff",
    "basedpyright>=1.38.1",
]

[tool.uv]
package = true

[tool.pyright]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
per-file-ignores = { "__init__.py" = ["F401"] }

[project.scripts]
mailvault = "mailvault.cli:main"

#[[tool.uv.index]]
#name = "pypi"
#url = "https://pypi.org/simple"

#[tool.uv.sources]
#mailvault = { path = ".", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
